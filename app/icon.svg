<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pprBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="globeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b8ff3d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#b8ff3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container squircle -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#pprBg)" stroke="#b8ff3d" stroke-width="10" stroke-opacity="0.6"/>
  <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.08"/>

  <!-- Globe Aura Glow -->
  <circle cx="256" cy="165" r="115" fill="url(#globeGlow)"/>

  <!-- Stylized Wireframe Global Icon -->
  <g stroke="#b8ff3d" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer boundary of Globe -->
    <circle cx="256" cy="165" r="95" stroke-width="7" stroke-opacity="0.95"/>
    
    <!-- Equator line -->
    <line x1="161" y1="165" x2="351" y2="165" stroke-width="6" stroke-opacity="0.85"/>
    
    <!-- Prime meridian vertical line -->
    <line x1="256" y1="70" x2="256" y2="260" stroke-width="6" stroke-opacity="0.85"/>
    
    <!-- Central meridian ellipse -->
    <ellipse cx="256" cy="165" rx="52" ry="95" stroke-width="6" stroke-opacity="0.9"/>
    
    <!-- Upper & Lower parallels (latitudes) -->
    <path d="M 174 125 Q 256 142 338 125" stroke-width="5" stroke-opacity="0.75"/>
    <path d="M 174 205 Q 256 188 338 205" stroke-width="5" stroke-opacity="0.75"/>
  </g>

  <!-- Brand Monogram PPR -->
  <text x="256" y="378" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="142" font-weight="900" letter-spacing="-3">
    <tspan fill="#ffffff">PP</tspan><tspan fill="#b8ff3d">R</tspan>
  </text>

  <!-- GLOBAL Sub-Brand Tag & Orbit Nodes -->
  <g fill="#b8ff3d">
    <circle cx="170" cy="426" r="4.5" fill-opacity="0.9"/>
    <text x="256" y="432" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="10" fill="#b8ff3d" fill-opacity="0.9">GLOBAL</text>
    <circle cx="342" cy="426" r="4.5" fill-opacity="0.9"/>
  </g>
</svg>
